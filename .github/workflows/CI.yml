name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        uses: julia-actions/julia-runtest@v1

      # Generate coverage only on the latest Julia version
      # running on Ubuntu.
      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'

      # Verify that the coverage report exists.
      - name: Verify coverage report
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "Checking coverage report..."
          ls -lh lcov.info
          head -n 10 lcov.info

      # Upload coverage using GitHub OIDC authentication.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.julia-version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true
          verbose: true